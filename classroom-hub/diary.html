<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title>나의 일기장 · 교실 도구함</title><link rel="stylesheet" href="diary.css"><script src="diary.js" defer></script></head>
<body><header><a href="index.html">← 교실 도구함</a><span>나만의 작은 기록실</span></header><main><section class="intro"><p class="eyebrow">MY DAILY JOURNAL</p><h1>오늘은 어떤 하루였나요?</h1><p>소소한 순간도, 마음에 남은 생각도. 여기에 천천히 적어보세요.</p><span class="local">● 내 컴퓨터에 저장되는 일기</span></section><div class="workspace"><aside><div class="list-head"><h2>지난 기록 <small id="count">0</small></h2><button id="new" type="button">＋ 새 일기</button></div><label for="search" class="sr-only">일기 검색</label><input id="search" type="search" placeholder="제목이나 내용으로 검색"><div id="entries"></div></aside><section class="paper"><form id="editor"><div class="paper-top"><span id="mode">새로운 이야기</span><label>날짜 <input id="date" type="date" required></label></div><label class="field-label" for="title">오늘의 제목</label><input id="title" maxlength="120" placeholder="오늘을 한 문장으로 표현한다면" required><label class="field-label" for="mood">오늘의 마음</label><select id="mood"><option value="😊">😊 행복해요</option><option value="😌">😌 편안해요</option><option value="😐">😐 그저 그래요</option><option value="😔">😔 슬퍼요</option><option value="😤">😤 답답해요</option></select><label class="field-label" for="body">하루의 기록</label><textarea id="body" maxlength="50000" placeholder="오늘 있었던 일, 기억하고 싶은 순간을 적어보세요…" required></textarea><div class="paper-bottom"><span id="letters">0자</span><div><button id="delete" type="button" hidden>일기 삭제</button><button id="save" type="submit">일기 저장</button></div></div><p id="status" role="status" aria-live="polite"></p></form></section></div><footer>저장 버튼을 누르면 로컬 데이터베이스에 기록됩니다. 이 기기를 함께 쓰는 사람은 기록을 볼 수 있습니다.</footer></main></body></html>
