<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소수 탐험대 · 교실 도구함</title><link rel="stylesheet" href="decimal-dungeon.css"><script src="decimal-dungeon.js" defer></script></head>
<body><header><a href="index.html">← 교실 도구함</a><span>4학년 · 소수의 덧셈과 뺄셈</span></header><main>
<p class="eyebrow">DECIMAL QUEST</p><h1>소수 탐험대</h1><p class="intro">소수 문제를 풀고, 숲속 몬스터 10마리를 물리쳐요!</p>
<section id="setup" class="panel"><h2>함께 떠날 탐험가</h2><div class="choices"><button data-hero="🧙" aria-pressed="true">🧙<span>마법사</span></button><button data-hero="🥷" aria-pressed="false">🥷<span>닌자</span></button><button data-hero="🧝" aria-pressed="false">🧝<span>궁수</span></button></div><p>정답은 경험치 +10 · 오답은 하트 −1<br>하트가 없어져도 다시 도전할 수 있어요.</p><button id="start" class="primary">탐험 시작 →</button></section>
<section id="game" hidden><div class="stats"><span id="progress"></span><span id="hearts" aria-label="남은 체력"></span><span id="level"></span></div><div class="scene"><span id="hero" class="character">🧙</span><div class="versus">✦<small>반짝이는 소수의 숲</small></div><span id="monster" class="character">👾</span></div><section class="panel"><p class="eyebrow" id="mission"></p><h2 id="question"></h2><form id="answer-form"><label for="answer">계산한 답을 입력하세요</label><div class="answer-row"><input id="answer" inputmode="decimal" autocomplete="off" placeholder="예: 1.25" required><button id="submit" class="primary">정답 확인</button></div></form><button id="hint-button" class="text-button">💡 힌트 보기</button><p id="hint" hidden></p><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" hidden>다음 몬스터 →</button></section><button id="restart" class="text-button">처음부터 다시 하기</button></section>
<section id="result" class="panel" hidden><div class="trophy">🏆</div><h2 id="result-title"></h2><p id="result-copy"></p><button id="again" class="primary">다시 탐험하기</button></section><p id="best" class="footnote"></p><p class="footnote">최고 기록은 이 브라우저에만 저장돼요. 이름이나 로그인은 필요 없어요.</p>
</main></body></html>
